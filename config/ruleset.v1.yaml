# =============================================================================
# RULESET v1 — IA da NBA
# =============================================================================
# Este arquivo É a estratégia do CJ. O motor não contém nenhuma regra hardcoded.
#
# HOMOLOGADO em 18/08/2026 — as 12 pendências foram respondidas pelo cliente.
# Rastreabilidade das respostas: docs/05-perguntas-abertas.md
#
# REGRA DE OURO: trocar qualquer valor aqui NÃO pode exigir mudança de código.
# Se exigir, o motor está errado, não o ruleset.
# =============================================================================

version: 1
status: homologado
homologado_em: 2026-08-18

# -----------------------------------------------------------------------------
# MÉDIA — base de comparação de toda a Lista Secreta e de todo o Fire Live
# -----------------------------------------------------------------------------
media:
  janela: temporada # [P1] temporada inteira
  modo: movel # [P1] recalcula sozinha a cada jogo novo

# -----------------------------------------------------------------------------
# TEMPORADA — como o rótulo é montado
#
# A NBA atravessa o ano civil: a temporada 2025-26 começa em outubro de 2025.
# Fato do calendário da liga, não parâmetro de estratégia — vive aqui pela mesma
# razão que quartos_por_jogo: para que nenhum número precise existir solto no
# código, e para que a resposta do provedor seja um diff de YAML.
#
# ATENÇÃO: `formato` precisa bater com o que o provedor devolve em
# /standings?season=... Se ele responder "2025", trocar para `ano_inicial`.
# Enquanto a fonte não estiver contratada, isto é uma suposição declarada.
# -----------------------------------------------------------------------------
temporada:
  mes_inicio: 10 # outubro
  formato: dois_anos # 2025-26   (alternativa: ano_inicial -> 2025)

# -----------------------------------------------------------------------------
# RODADA — o fuso que decide a que DIA um jogo pertence
#
# Respondido pelo cliente em 24/08/2026: fuso do horário de Brasília.
#
# Governa duas coisas: qual é a "rodada de hoje" e em que horário os jogos
# aparecem na tela. Antes disto o servidor da Vercel roda em UTC, e todo horário
# de jogo saía 3 horas adiantado para o assinante brasileiro.
#
# ⚠️  CONSEQUÊNCIA: a NBA joga à noite nos EUA. No inverno americano — que é
# quase toda a temporada — o leste dos EUA está 2 horas atrás de Brasília, então
# um jogo das 22h30 no horário de lá começa 00h30 aqui, JÁ NO DIA SEGUINTE. Uma
# mesma noite de NBA se parte em duas rodadas, e os jogos da costa oeste caem na
# lista de "amanhã".
#
# A alternativa é `America/New_York`, que é a convenção da própria liga: a noite
# inteira fica num dia só. Trocar é editar a linha abaixo — nenhum código muda.
# -----------------------------------------------------------------------------
rodada:
  fuso: America/Sao_Paulo

# -----------------------------------------------------------------------------
# ARREDONDAMENTO
# Validado contra os 4 exemplos numéricos do documento do CJ:
#   24 ppg -> alvo 9  |  5,4 ppg -> alvo 4  |  5 apg -> alvo 2  |  11 rpg -> alvo 6
# Só esta política satisfaz os quatro simultaneamente.
# -----------------------------------------------------------------------------
arredondamento:
  politica: precisao_cheia_arredonda_no_fim
  regra: meio_para_cima

# -----------------------------------------------------------------------------
# NÍVEIS
# -----------------------------------------------------------------------------
niveis:
  ordem: [MVP, ALL_STAR, SUPORTE, RANDOLA]
  # INTERRUPTOR. Este array é o que motor/index.ts e motor/fire-live/avaliar.ts
  # iteram. Rebotes e assistências JÁ TÊM dado real no banco (versão do CJ de
  # 21/09), mas as tabelas de confiança e de odds dos dois continuam
  # `origem: demonstracao` — números nossos, não dele. Religar aqui põe apito
  # com número inventado no celular de assinante pagante.
  # Religar quando o CJ mandar % e odds de rebotes e assistências.
  atributos: [PONTOS]

# -----------------------------------------------------------------------------
# LISTA SECRETA — MÉTODO 1: OSCILAÇÃO
# apitado  <=>  pontos_no_jogo <= (media - delta[nivel])
# -----------------------------------------------------------------------------
oscilacao:
  delta:
    MVP: 6
    ALL_STAR: 5
    SUPORTE: 5
    RANDOLA: 4

  excecoes_por_jogador:
    luka-doncic: 7 # única exceção nominal do documento

  criterio_sequencia: limiar # [P3] jogo só conta se <= (media - delta)

  # [P2] jogo não disputado NÃO quebra a sequência; é como se a data não existisse.
  # Ver docs/05-perguntas-abertas.md > "Consequências"
  dnp: ignora

  nivel_minimo_apito: # nível a partir do qual cada classe aparece na lista
    MVP: 1
    ALL_STAR: 1
    SUPORTE: 2
    RANDOLA: 2

  turbo:
    aplica_a: [MVP]
    exige_nivel: 3
    acumula_bonus: true # [P9] turbo (azul) E os +4% ao mesmo tempo

# -----------------------------------------------------------------------------
# LISTA SECRETA — MÉTODO 2: OPD (Oportunidade Por Desfalque)
# Escala INVERTIDA em relação à oscilação: mais perto da vaga = nível mais alto.
# -----------------------------------------------------------------------------
opd:
  janela: 3 # 3 jogadores abaixo do bloco de desfalque
  exige_prefixo_hierarquia: true # desfalque obrigatoriamente de cima pra baixo

  mapa_nivel: # distância do desfalque -> nível do apito
    1: 3 # próximo imediato  -> nível 3 (verde)
    2: 2 # segundo depois    -> nível 2 (laranja)
    3: 1 # terceiro depois   -> nível 1 (amarelo)

  turbo:
    exige_opd_nivel: 3
    exige_oscilacao_nivel: 2

# -----------------------------------------------------------------------------
# FIRE LIVE — exclusivamente 1º quarto
# -----------------------------------------------------------------------------
fire_live:
  quarto: 1 # o Fire Live observa exclusivamente o 1º quarto
  # Fato do basquete, não parâmetro de estratégia — mas vive aqui para que
  # nenhum número de regra precise existir dentro do código do motor.
  quartos_por_jogo: 4

  multiplicadores:
    pontos_classificado: 1.5
    pontos_randola: 2.5
    pontos_nao_classificado: 3.0
    rebotes: 2.0

  assistencias:
    operacao: soma
    valor: 1
    # MUDOU entre versões do documento: a anterior dizia >= 5, a de 21/09 diz
    # >= 4. Vale a nova.
    media_minima: 4 # só entra jogador com apg >= 4

  travas:
    pontos_alvo_minimo: 4 # alvo só vale se >= 4
    rebotes_alvo_minimo: 2 # alvo só vale se > 2

  # Cadência do loop de observação do 1Q. NÃO é parâmetro de estratégia — é
  # operação. Vive aqui pela mesma razão que quartos_por_jogo: para que nenhum
  # número precise existir solto dentro do código. Ver ADR-0003.
  observacao:
    intervalo_segundos: 20
    # Trava dura de encerramento. O 1Q tem 12 min de relógio, mas relógio
    # parado, revisão de arbitragem e intervalo comercial esticam o tempo real.
    # Passado este limite o workflow encerra mesmo que o provedor ainda diga
    # "1º quarto" — o requisito é encerrar em QUALQUER hipótese.
    limite_minutos: 45

  modo_fire:
    aplica_a: [MVP, ALL_STAR]
    percentual_media: 0.75 # [P4] 75% — resolvido a favor da observação

  # Suporte e Randola só apitam em pontos quando o BLOCO DE TOPO do time
  # está inteiramente fora da partida.
  presenca_topo:
    # [P5] fora da partida. NÃO exige rastrear substituição em tempo real.
    criterio: dnp
    bloqueia_niveis: [SUPORTE, RANDOLA]
    times_isentos: [UTA, DET, DEN]

    bloco_topo: # [P6] + [P7] unificados — ver ADR-0006
      com_mvp: todos_os_mvps # todos os MVPs precisam estar fora (Philadelphia: os 2)
      sem_mvp: jogador_1 # time sem MVP -> olha o nº 1 da hierarquia

# -----------------------------------------------------------------------------
# CONFIANÇA (nota da análise do CJ — NÃO é probabilidade de aposta) [P12]
# Ver ADR-0005 e docs/04-design-system.md
# -----------------------------------------------------------------------------
confianca:
  base: # corresponde ao nível de apito 1
    MVP: { 20: 95, 25: 90, 30: 85, 35: 80 }
    ALL_STAR: { 15: 90, 20: 85, 25: 80 }
    SUPORTE: { 10: 90, 15: 85, 20: 80 }
    RANDOLA: { 5: 85, 10: 80 }

  bonus_por_nivel_apito:
    MVP: { 2: 2.0, 3: 4.0 }
    ALL_STAR: { 2: 1.0, 3: 2.0 }
    SUPORTE: { 2: 0.5, 3: 1.0 }
    # [P8] Randola nunca ganha bônus, em nenhum método. Sempre tabela base.
    RANDOLA: { 2: 0.0, 3: 0.0 }

  # Nível 1 só é alcançável por OPD para SUPORTE e RANDOLA — consequência
  # automática de oscilacao.nivel_minimo_apito, não é regra separada.

# -----------------------------------------------------------------------------
# CONFIANÇA — EXIBIÇÃO (identidade 02)
#
# ⚠️  DEMONSTRAÇÃO. As 5 faixas traduzem o % (80–95 na prática) em intensidade
# visual (rampa de um só matiz). NÃO é a escala de 5 cores removida pelo
# ADR-0005: nenhuma faixa usa cor de apito. Calibração real: pergunta ao CJ.
# -----------------------------------------------------------------------------
confianca_exibicao:
  origem: demonstracao
  faixas:
    # `rotulo_curto` é o que cabe na coluna do hero do detalhe. Sem ele, a tela
    # usa o `rotulo` inteiro — nenhum componente fatia texto de ruleset.
    - { de: 80, grau: 1, rotulo: CONFIANÇA BOA, rotulo_curto: BOA }
    - { de: 83, grau: 2, rotulo: CONFIANÇA SÓLIDA, rotulo_curto: SÓLIDA }
    - { de: 86, grau: 3, rotulo: CONFIANÇA FORTE, rotulo_curto: FORTE }
    - { de: 89, grau: 4, rotulo: CONFIANÇA MUITO FORTE, rotulo_curto: MUITO FORTE }
    # "MÁXIMA" saiu em 12/09: o superlativo soava como garantia de acerto
    # (pedido do parceiro depois da call de 08/09). O NOME do número continua
    # sendo nota de confiança — trocar por "probabilidade" diria que ele é o
    # que ele não é, e criaria justamente a expectativa que a troca evita.
    - { de: 93, grau: 5, rotulo: SINAL MAIS FORTE, rotulo_curto: MAIS FORTE }

# -----------------------------------------------------------------------------
# ODDS — leitura das casas, agregação em faixa. Nunca envio de aposta. ADR-0004.
# -----------------------------------------------------------------------------
odds:
  fonte: casas
  agregacao: mediana # mediana resiste a outlier de uma casa
  # UMA casa basta para a linha ser cotada (decisão do parceiro, 19/09/2026).
  # Era 2: com uma casa só, NENHUMA linha virava cotação e tudo caía na
  # tabela_estatica — o assinante nunca veria a odd real.
  casas_minimas: 1
  # Decisão do parceiro (19/09/2026): o produto passa a trabalhar com UMA casa,
  # então o card escreve a odd sozinha ("ODD 1,85"), sem o rótulo MÉDIA — não
  # há o que promediar — e sem a faixa, que com uma casa viraria "1,85–1,85".
  # QUEM É A CASA aparece no detalhe do apito, na tabela "Odds por casa" que
  # já existe lá. O aviso do ADR-0004 continua em toda tela com odd.
  #
  # Histórico: 'media' entrou em 25/08 (card ODD MÉDIA); a redação homologada
  # original dizia 'sempre faixa, nunca odd única'. As três formas convivem no
  # enum — voltar a 'media' ou 'faixa' aqui religa o comportamento anterior sem
  # tocar código.
  exibicao: casa_unica
  fallback: tabela_estatica

  tabela_estatica: # usada quando não há cobertura das casas
    MVP: { 20: [1.07, 1.25], 25: [1.30, 1.70], 30: [2.00, 2.50], 35: [3.00, 5.00] }
    ALL_STAR: { 15: [1.30, 1.70], 20: [2.00, 2.50], 25: [3.00, 5.00] }
    SUPORTE: { 10: [1.39, 1.70], 15: [2.00, 2.50], 20: [3.00, 5.00] }
    RANDOLA: { 5: [1.80, 2.20], 10: [2.30, 3.50] }

# -----------------------------------------------------------------------------
# SUGESTÃO ESTATÍSTICA — o que o assistente ranqueia quando pedem dica
#
# Decisão do parceiro, 19/09/2026. A METODOLOGIA continua sendo quem apita;
# isto é uma segunda leitura, exibida ao lado dela e nunca confundida com ela
# (o assistente marca "fora da lista de hoje" e o código verifica).
#
# Quem ordena é o MOTOR, função pura, sobre estes valores. A IA recebe a lista
# pronta e narra — ela não calcula, porque calcular é onde ela inventa.
# -----------------------------------------------------------------------------
sugestao_estatistica:
  criterio: taxa_na_linha # quantas vezes o jogador passou da linha
  janela_jogos: 10 # sobre quantos jogos ENCERRADOS se conta
  minimo_jogos: 10 # abaixo disso o jogador não entra: 2 de 2 não é 100%
  maximo_por_time: 8 # 5 cobre só o quinteto e deixa o banco (os randolas) fora

  # QUAL TAXA ORDENA, já que cada nível tem linhas próprias: um MVP é medido em
  # 20/25/30/35 e um RANDOLA em 5/10, e comparar as duas é comparar coisas
  # diferentes. 'menor_linha' ordena pela linha mais baixa do nível — a aposta
  # mais conservadora de cada um. CONFIRMAR COM O CJ: é definição de
  # metodologia, e trocar aqui muda o ranking sem tocar código.
  ordenacao: menor_linha

  # O recorte que vai para os fatos do chat. Quanto mais número injetado, mais
  # larga a malha do validador que impede estatística inventada — estes valores
  # são o freio.
  contexto:
    incluir_adversario: true # o jogo inteiro, não só o time perguntado
    todos_os_atributos: true # pontos, rebotes e assistências do time
    jogos_lembrados: 2 # partidas citadas antes continuam nos fatos
    topo_do_dia: 15 # POR ATRIBUTO, quando a pergunta não nomeia ninguém

# -----------------------------------------------------------------------------
# PUSH
# -----------------------------------------------------------------------------
push:
  marcos_green:
    # [P11] começa em 25 de propósito: a odd de 20 é baixa demais pra notificar
    MVP: [25, 30, 35, 40, 45, 50]
    ALL_STAR: [20, 25, 30, 35, 40, 45, 50]
    SUPORTE: [20, 25, 30, 35, 40, 45]
    RANDOLA: [15, 20, 25, 30, 35]

  canais_independentes: # usuário liga/desliga cada um separadamente
    - FIRE_LIVE_APITO
    - GREEN
    - LISTA_SECRETA

# -----------------------------------------------------------------------------
# PUBLICAÇÃO — cadência operacional (proposta comercial, p.9)
# -----------------------------------------------------------------------------
publicacao:
  lista_secreta:
    # A lista sai 1h antes do primeiro jogo do dia, para dar tempo de o usuário
    # se organizar antes da rodada começar.
    antecedencia_minutos: 60

# -----------------------------------------------------------------------------
# AVISOS
# -----------------------------------------------------------------------------
avisos:
  # Alerta de dado parado. Números OPERACIONAIS, não estratégia — vivem aqui
  # pela mesma razão de fire_live.observacao: nenhum limiar solto no código.
  # Assimétrico de propósito: fora da janela dos jogos, dado de 30 min é
  # normal; com a bola rolando, 90 s já é o Fire Live perdendo a janela.
  dado_parado:
    fora_de_jogo_minutos: 30
    em_janela_segundos: 90
    janela_antecedencia_minutos: 30 # jogo prestes a começar já conta como janela
    realerta_minutos: 30 # provedor parado há 1h não pode virar 60 alertas

  blowout:
    quarto: 4
    diferenca_pontos: 25
    aplica_a: TITULARES
    local: introducao_das_estrategias # lembrete fixo, não dentro do card

# -----------------------------------------------------------------------------
# POR ATRIBUTO — REBOTES e ASSISTÊNCIAS
#
# ⚠️  DEMONSTRAÇÃO. NÃO HOMOLOGADO.
#
# O Mestre da NBA classificou apenas PONTOS. Rebotes e assistências não têm
# lista de níveis nem tabela de confiança definidas por ele. Os números abaixo
# foram INVENTADOS para a apresentação ao cliente — existem para provar que o
# motor é genérico por atributo, não para sugerir entrada de verdade.
#
# PONTOS não aparece aqui de propósito: continua governado pelos blocos
# homologados acima (`oscilacao`, `confianca`, `odds`, `push`), intocados.
#
# Quando as listas reais chegarem, isto vira um diff de YAML: `origem` passa a
# `homologado` e os números trocam. Nenhuma linha de código muda.
# -----------------------------------------------------------------------------
por_atributo:
  REBOTES:
    origem: demonstracao

    # DOCX recebido em 08/09, p. 14: OPD só N3/N2; oscilação nos três níveis.
    # Deltas, linhas, confiança, odds e greens abaixo continuam demonstrativos.
    opd:
      janela: 2
      mapa_nivel: { 1: 3, 2: 2 }

    # Faixas de média que definem o NÍVEL DO JOGADOR em rebotes — tabela
    # "Classificação de jogadores rebotes" do documento de 21/09. São números
    # dele, não nossos.
    #
    # Nenhuma regra do motor classifica por média: o nível vem da lista curada
    # do CJ, nome por nome (ver a armadilha dos elencos em CLAUDE.md). Estas
    # faixas existem para que o número viva no lugar versionado e para que a
    # demo gere médias coerentes com o nível que ela atribui.
    #
    # Sem RANDOLA: o documento não dá faixa para ele em rebotes, e nenhum
    # randola aparece na lista — é a pergunta 2 de docs/05-perguntas-abertas.md.
    # ⚠️  As faixas têm vãos: 9,9 rebotes não é MVP (>=10) nem All Star (7–9,8).
    # Pergunta 4 do mesmo documento.
    classificacao:
      MVP: { min: 10 }
      ALL_STAR: { min: 7, max: 9.8 }
      SUPORTE: { min: 4, max: 6.9 }

    # Delta do DOCUMENTO (versão de 21/09): "a oscilação é considerada em
    # rebotes quando o jogador faz <=4 abaixo da média". Não é mais estimativa
    # nossa. O `origem: demonstracao` do bloco continua valendo por causa de
    # `confianca` e `odds`, que o documento não dá para rebotes.
    oscilacao:
      delta: { MVP: 4, ALL_STAR: 4, SUPORTE: 4, RANDOLA: 4 }
      nivel_minimo_apito: { MVP: 1, ALL_STAR: 1, SUPORTE: 1, RANDOLA: 1 }

    confianca:
      base:
        MVP: { 8: 90, 10: 85, 12: 80 }
        ALL_STAR: { 6: 90, 8: 85, 10: 80 }
        SUPORTE: { 4: 90, 6: 85, 8: 80 }
        RANDOLA: { 3: 85, 5: 80 }
      bonus_por_nivel_apito:
        MVP: { 2: 2.0, 3: 4.0 }
        ALL_STAR: { 2: 1.0, 3: 2.0 }
        SUPORTE: { 2: 0.5, 3: 1.0 }
        RANDOLA: { 2: 0.0, 3: 0.0 }

    odds:
      MVP: { 8: [1.30, 1.60], 10: [1.90, 2.40], 12: [2.80, 3.60] }
      ALL_STAR: { 6: [1.35, 1.65], 8: [2.00, 2.50], 10: [3.00, 4.20] }
      SUPORTE: { 4: [1.40, 1.75], 6: [2.10, 2.60], 8: [3.20, 4.50] }
      RANDOLA: { 3: [1.80, 2.30], 5: [2.60, 3.80] }

    marcos_green:
      MVP: [10, 12, 15, 18, 20]
      ALL_STAR: [8, 10, 12, 15]
      SUPORTE: [8, 10, 12]
      RANDOLA: [6, 8, 10]

  ASSISTENCIAS:
    origem: demonstracao

    # Faixas de média que definem o NÍVEL DO JOGADOR em assistências — seção
    # "Assistências" do documento de 21/09. Mesma função e mesmas ressalvas das
    # faixas de rebotes acima, inclusive a ausência de RANDOLA e o vão
    # (7,95 assistências não é All Star nem MVP).
    classificacao:
      MVP: { min: 8 }
      ALL_STAR: { min: 6, max: 7.9 }
      SUPORTE: { min: 4, max: 5.9 }

    # Delta da MESMA seção: "apita quando o jogador desse nível fizer 4 / 3 / 3
    # assistências ou menos abaixo da média dele em algum jogo".
    #
    # ⚠️  O documento se contradiz. O bloco geral de oscilação, lá no fim, diz
    # "a oscilação é considerada em assistências quando o jogador faz <=2
    # abaixo da média", sem separar nível — e era dele que estes deltas saíam
    # (3/2/2/1, o "<=2" com o mesmo degrau por nível que pontos usa).
    # Decisão do parceiro em 22/09/2026: vale a SEÇÃO DE ASSISTÊNCIAS, que é
    # específica por nível. Era a pergunta 3 de docs/05-perguntas-abertas.md.
    #
    # RANDOLA fica em 1, o único número que o documento permite derivar para
    # ele: o "<=2" geral menos um degrau, como em pontos, onde randola é
    # base-1. A seção não o cobre e a lista de assistências não tem randola.
    oscilacao:
      delta: { MVP: 4, ALL_STAR: 3, SUPORTE: 3, RANDOLA: 1 }

    confianca:
      base:
        MVP: { 5: 90, 7: 85, 9: 80 }
        ALL_STAR: { 4: 90, 6: 85, 8: 80 }
        SUPORTE: { 3: 90, 5: 85 }
        RANDOLA: { 2: 85, 4: 80 }
      bonus_por_nivel_apito:
        MVP: { 2: 2.0, 3: 4.0 }
        ALL_STAR: { 2: 1.0, 3: 2.0 }
        SUPORTE: { 2: 0.5, 3: 1.0 }
        RANDOLA: { 2: 0.0, 3: 0.0 }

    odds:
      MVP: { 5: [1.30, 1.60], 7: [1.95, 2.45], 9: [3.00, 4.00] }
      ALL_STAR: { 4: [1.35, 1.70], 6: [2.05, 2.55], 8: [3.10, 4.30] }
      SUPORTE: { 3: [1.45, 1.80], 5: [2.30, 3.00] }
      RANDOLA: { 2: [1.75, 2.20], 4: [2.90, 4.00] }

    marcos_green:
      MVP: [8, 10, 12, 15]
      ALL_STAR: [6, 8, 10, 12]
      SUPORTE: [5, 7, 9]
      RANDOLA: [4, 6, 8]

# -----------------------------------------------------------------------------
# GESTÃO DE BANCA
#
# ⚠️  DEMONSTRAÇÃO. NÃO HOMOLOGADO.
#
# O documento do CJ menciona a aba de gestão e diz que "o modelo completo foi
# enviado no grupo" — arquivo que não chegou ao repositório. O modelo abaixo é
# uma proporcionalidade simples INVENTADA para a apresentação: quanto maior o
# nível do apito, maior a entrada, com teto por entrada e limites de sessão.
#
# Não é conselho financeiro nem a estratégia do CJ. Quando o modelo dele
# chegar, os números trocam aqui e a tela acompanha sem mudar de código.
# -----------------------------------------------------------------------------
gestao_banca:
  origem: demonstracao

  # Uma unidade = 1% da banca. É a convenção mais comum de gestão, e é o único
  # número do bloco que não sai de uma tabela: define a escala de todo o resto.
  unidade_percentual_banca: 1.0

  # Quanto entrar, em unidades, por nível do apito.
  unidades_por_nivel_apito:
    1: 0.5
    2: 1.0
    3: 2.0

  # Turbo soma; nunca multiplica. Multiplicar faria o nível 3 com turbo saltar
  # para 4 unidades, acima do teto — e o teto deixaria de ser o teto.
  bonus_turbo_unidades: 0.5

  # Tetos e limites de sessão, em percentual da banca.
  teto_por_entrada_percentual: 3.0
  stop_win_percentual: 10.0
  stop_loss_percentual: 6.0

# -----------------------------------------------------------------------------
# MATCHUP — programado, desligado. Liberar 20 dias após início da competição.
# -----------------------------------------------------------------------------
matchup:
  habilitado: false
  liberar_apos_dias_de_competicao: 20
