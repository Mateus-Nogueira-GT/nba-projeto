name: CI

on:
  push:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: lint
        run: npm run lint

      - name: guarda de fronteira do motor
        run: npm run boundaries

      - name: test
        run: npm run test

      # Sem isto, um erro de build só aparecia no deploy da Vercel — depois do
      # merge, e com a produção esperando (diagnóstico de 13/09).
      - name: build
        run: npm run build

      - name: conferência (HTML das telas na falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: conferencia
          path: .superpowers/conferencia
          if-no-files-found: ignore
